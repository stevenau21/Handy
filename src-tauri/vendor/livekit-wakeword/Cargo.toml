[package]
name = "livekit-wakeword"
version = "0.1.3"
description = "ONNX-based wake word detection for LiveKit"
edition = "2021"
license = "Apache-2.0"

[dependencies]
ndarray = "0.17.2"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std"] }
resampler = "0.4"
thiserror = "2"

[target.'cfg(not(all(target_arch = "aarch64", target_os = "windows", target_env = "msvc")))'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["alternative-backend"] }
ort-tract = "0.3.0+0.22"

[dev-dependencies]
hound = "3.5"
